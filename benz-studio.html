B.items=type=>type==='doctor'?B.state.doctors:type==='analysis'?B.state.analyses:B.state.drips;

if(s.bookingMode==='link'&&url){target.innerHTML=`<div class="external-booking"><h3>${t('mis-title','Записаться на приём')}</h3><p class="form-note" style="margin:20px 0">${t('mis-description',B.lorem)}</p><a class="button" href="${e(url)}" target="_blank" rel="noopener noreferrer">${t('mis-cta','Записаться на приём')}${arrow}</a></div>`;return;}
const items=B.items(B.ui.type);if(!items.some(d=>d.id===B.ui.item))B.ui.item=items[0]?.id||'';

rm-consent','Согласие на обработку персональных данных.')} <button type="button" data-legal="privacy" style="font-size:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline">${t('form-policy-link','Политика конфиденциальности')}</button></span></label><button type="submit" class="button" data-style="submit-button">${t('form-submit','Отправить заявку')}${arrow}</button><p class="form-note">${t('form-note','После отправки заявки с вами свяжется администратор для подтверждения.')}</p><p class="form-note" id="demo-notice">Демонстрация: расписание тестовое, данные никуда не отправляются.</p><div class="form-status" role="status" hidden></div></form>`;
B.bindForm();B.applyStyles();};
B.book=(type,item)=>{if(type)B.ui.type=type;if(item)B.ui.item=item;B.renderBooking(B.formDraft());document.getElementById('booking').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});history.replaceState(null,'','#booking');};
B.bindForm=()=>{const f=document.getElementById('appointment-form');if(!f)return;f.querySelector('#booking-type').onchange=ev=>{const d=B.formDraft();B.ui.type=ev.target.value;B.ui.item='';B.ui.time='';B.renderBooking(d);};f.querySelector('#booking-item').onchange=ev=>{B.ui.item=ev.target.value;};f.querySelector('#booking-date').onchange=ev=>{const date=ev.target.value;const chosen=new Date(date+'T12:00:00');if(date&&!B.state.schedule.days.includes(chosen.getDay())){ev.target.setCustomValidity('В демонстрационном расписании этот день недоступен. Выберите другой день.');ev.target.reportValidity();B.ui.date='';B.ui.time='';f.querySelector('#booking-time').innerHTML='<option value="">Сначала выберите дату</option>';f.querySelector('#booking-time').disabled=true;return;}ev.target.setCustomValidity('');B.ui.date=date;B.ui.time='';B.renderBooking(B.formDraft());};f.querySelector('#booking-time').onchange=ev=>B.ui.time=ev.target.value;

B.bind=()=>{document.getElementById('analysis-search').oninput=ev=>{B.ui.query=ev.target.value;B.renderAnalyses();};document.getElementById('load-drips').onclick=()=>{B.ui.dripLimit=B.state.drips.length;B.renderDrips();};document.querySelector('.menu-toggle').onclick=ev=>{const btn=ev.currentTarget;const open=btn.getAttribute('aria-expanded')!=='true';btn.setAttribute('aria-expanded',open);btn.setAttribute('aria-label',open?'Закрыть меню':'Открыть меню');document.getElementById('navigation').classList.toggle('open',open);};};
B.toast=message=>{const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(B.toastTimer);B.toastTimer=setTimeout(()=>el.classList.remove('show'),4000);};
document.addEventListener('click',ev=>{if(ev.defaultPrevented)return;const book=ev.target.closest('[data-book-type]');if(book){ev.preventDefault();B.book(book.dataset.bookType,book.dataset.bookItem);return;}const ag=ev.target.closest('[data-analysis-group]');if(ag){B.ui.analysisGroup=ag.dataset.analysisGroup;document.querySelectorAll('[data-analysis-group]').forEach(el=>el.setAttribute('aria-pressed',el===ag));B.renderAnalyses();return;}const dg=ev.target.closest('[data-drip-group]');if(dg){B.ui.dripGroup=dg.dataset.dripGroup;B.ui.dripLimit=6;document.querySelectorAll('[data-drip-group]').forEach(el=>el.setAttribute('aria-pressed',el===dg));B.renderDrips();return;}const legal=ev.target.closest('[data-legal]');if(legal){const kind=legal.dataset.legal;const url=B.safeURL(B.state.settings[kind+'Url']);if(url){window.open(url,'_blank','noopener,noreferrer');return;}document.getElementById('legal-title').textContent=kind==='privacy'?B.value('footer-privacy','Политика конфиденциальности'):B.value('footer-license','Лицензия');document.getElementById('legal-body').innerHTML=`<p>${t('legal-'+kind,B.lorem)}</p><p>Документ не предоставлен. Добавьте ссылку в настройках перед запуском сайта.</p>`;document.getElementById('legal-dialog').showModal();return;}if(ev.target.closest('[data-close-dialog]'))document.getElementById('legal-dialog').close();if(ev.target.closest('.nav a')){document.getElementById('navigation').classList.remove('open');document.querySelector('.menu-toggle').setAttribute('aria-expanded','false');}});
B.render();

</script><script data-editor>(()=>{'use strict';

E.settingsPanel=()=>{const s=B.state.settings;return `<h4>Контакты</h4><label><span>Телефон (для клика и набора)</span><input data-setting="phone" value="${e(s.phone)}" placeholder="+7 …"></label><label><span>Email</span><input data-setting="email" value="${e(s.email)}" placeholder="clinic@example.ru"></label><label><span>Адрес</span><input data-setting="address" value="${e(s.address)}" placeholder="Воронеж, ул. …"></label><label><span>Ссылка на виджет карты (iframe src)</span><input data-setting="mapUrl" value="${e(s.mapUrl)}" placeholder="https://yandex.ru/map-widget/…"></label><h4>МИС и запись</h4><p>По умолчанию форма работает локально как демонстрация. Чтобы принимать настоящие записи, укажите ссылку на расписание вашей МИС.</p><label><span>Режим записи</span><select data-setting="bookingMode">${E.options([['demo','Демонстрационная форма'],['link','Открывать расписание МИС'],['iframe','Встроить виджет МИС (iframe)']],s.bookingMode)}</select></label><label><span>URL расписания МИС</span><input data-setting="misUrl" value="${e(s.misUrl)}" placeholder="https://…"></label><p>Для iframe МИС должна разрешать встраивание. Предвыбор внутри внешней МИС зависит от её API; на сайте он работает в демоформе.</p><h4>Документы и соцсети</h4>${[['privacyUrl','Политика конфиденциальности'],['licenseUrl','Лицензия'],['socialUrl','Соцсеть']].map(([k,label])=>`<label><span>${label}</span><input data-setting="${k}" value="${e(s[k])}" placeholder="https://…"></label>`).join('')}<button class="studio-button primary" data-action="apply-settings">Применить настройки</button><h4>Данные проекта</h4><p>В JSON-проекте также доступны список врачей, анализы, цены, группы капельниц и демонстрационное расписание. Импорт восстанавливает тексты, цвета и изображения.</p><div class="studio-stack"><button class="studio-button" data-action="export-json">Скачать JSON-проект</button><label class="studio-button" style="margin:0;cursor:pointer">Загрузить JSON-проект<input id="studio-import" type="file" accept="application/json,.json" hidden></label><button class="studio-button danger" data-action="reset-all">Сбросить все изменения</button></div>`;};

E.renderTextResults=query=>{const pairs=Object.entries(B.catalog).filter(([k,v])=>(k+' '+B.value(k,v)).toLowerCase().includes(query.toLowerCase()));const el=document.getElementById('studio-text-results');el.innerHTML=pairs.slice(0,150).map(([k,v])=>`<label><span title="${e(k)}" style="font-size:10px;color:#929a88">${e(k)}</span><textarea data-text-key="${e(k)}" style="min-height:65px">${e(B.value(k,v))}</textarea></label>`).join('')+(pairs.length>150?'<p>Уточните поиск, чтобы увидеть остальные тексты.</p>':'');};
E.select=(el)=>{document.querySelectorAll('.is-selected').forEach(x=>x.classList.remove('is-selected'));const attr=el.hasAttribute('data-edit')?'data-edit':el.hasAttribute('data-image')?'data-image':'data-style';E.selection={attr,key:el.getAttribute(attr)};el.classList.add('is-selected');E.tab='element';E.render();};
E.refreshText=(key,value)=>{B.state.texts[key]=value;document.querySelectorAll(`[data-edit="${CSS.escape(key)}"]`).forEach(el=>el.textContent=value);};
E.bind=()=>{mount.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{E.tab=btn.dataset.tab;E.render();});mount.querySelectorAll('[data-viewport]').forEach(btn=>btn.onclick=()=>{E.viewport=btn.dataset.viewport;E.render();});const select=mount.querySelector('#studio-select');if(select)select.onchange=()=>{E.selecting=select.checked;};const text=mount.querySelector('#studio-text');if(text){text.onfocus=E.checkpoint;text.oninput=()=>{E.refreshText(E.selection.key,text.value);E.changed();};text.onchange=()=>{B.renderBooking(B.formDraft());};}
const parent=mount.querySelector('#studio-parent');if(parent)parent.onchange=()=>{const el=document.querySelector(`[data-style="${CSS.escape(parent.value)}"]`);if(el)E.select(el);};
mount.querySelectorAll('[data-theme],[data-themehex]').forEach(input=>{const key=input.dataset.theme||input.dataset.themehex;input.onfocus=E.checkpoint;input.oninput=()=>{if(!/^#[\da-f]{6}$/i.test(input.value))return;B.state.theme[key]=input.value;mount.querySelectorAll(`[data-theme="${key}"],[data-themehex="${key}"]`).forEach(x=>x.value=input.value);E.changed();};});
mount.querySelectorAll('[data-color],[data-colorhex]').forEach(input=>{const key=input.dataset.color||input.dataset.colorhex;input.onfocus=E.checkpoint;input.oninput=()=>{if(!/^#[\da-f]{6}$/i.test(input.value))return;B.state.styles[E.selection.key]??={};B.state.styles[E.selection.key][key]=input.value;const el=E.findSelection();if(el)el.style[key]=input.value;mount.querySelectorAll(`[data-color="${key}"],[data-colorhex="${key}"]`).forEach(x=>x.value=input.value);E.changed();};});
mount.querySelectorAll('[data-clear-color]').forEach(btn=>btn.onclick=()=>{E.checkpoint();delete B.state.styles[E.selection.key]?.[btn.dataset.clearColor];E.changed();B.render();E.render();});
mount.querySelectorAll('[data-preset]').forEach(btn=>btn.onclick=()=>{E.checkpoint();B.state.theme.accent=btn.dataset.preset;E.changed();E.render();});
const link=mount.querySelector('#studio-link');if(link){link.onfocus=E.checkpoint;link.onchange=()=>{const url=B.safeURL(link.value,'all');if(link.value&&!url){B.toast('Укажите http(s), tel: или mailto: ссылку');return;}B.state.links[link.dataset.key]=url;document.querySelectorAll(`[data-link="${CSS.escape(link.dataset.key)}"]`).forEach(el=>{if(url)el.href=url;else el.removeAttribute('href');});E.changed();};}
const img=mount.querySelector('#studio-image');if(img)img.onchange=async()=>{const file=img.files[0];if(!file)return;if(file.size>6*1024*1024){B.toast('Изображение должно быть меньше 6 МБ');return;}if(!['image/png','image/jpeg','image/webp','image/svg+xml'].includes(file.type)){B.toast('Поддерживаются PNG, JPEG, WebP и SVG');return;}const uri=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});E.checkpoint();B.state.images[img.dataset.key]=uri;E.changed();B.render();E.render();};
mount.querySelectorAll('[data-reset-image]').forEach(btn=>btn.onclick=()=>{E.checkpoint();delete B.state.images[btn.dataset.resetImage];E.changed();B.render();E.render();});
const search=mount.querySelector('#studio-search-text');if(search)search.oninput=()=>E.renderTextResults(search.value);
const imp=mount.querySelector('#studio-import');if(imp)imp.onchange=async()=>{try{if(imp.files[0].size>25*1024*1024)throw Error('Файл слишком большой');const data=E.validate(JSON.parse(await imp.files[0].text()));E.checkpoint();B.state=data;E.changed();E.selection=null;B.render();E.render();B.toast('Проект загружен');}catch(err){B.toast('Не удалось загрузить проект: '+err.message);}};
};
mount.addEventListener('focusin',ev=>{if(ev.target.dataset.textKey)E.checkpoint();});
mount.addEventListener('input',ev=>{if(ev.target.dataset.textKey){E.refreshText(ev.target.dataset.textKey,ev.target.value);E.changed();}});
mount.addEventListener('change',ev=>{if(ev.target.dataset.textKey)B.renderBooking(B.formDraft());});
mount.addEventListener('click',async ev=>{const btn=ev.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;
if(action==='close'){E.open=false;E.render();return;}
if(action==='all-texts'){E.tab='texts';E.render();return;}
if(action==='expand-drips'){B.ui.dripLimit=B.state.drips.length;B.renderDrips();B.toast('Все капельницы показаны');return;}
if(action==='reset-element'){E.checkpoint();delete B.state.texts[E.selection.key];delete B.state.styles[E.selection.key];delete B.state.images[E.selection.key];B.render();E.changed();E.render();return;}
if(action==='reset-theme'){E.checkpoint();B.state.theme=structuredClone(B.defaults.theme);E.changed();E.render();return;}
if(action==='apply-settings'){const next={...B.state.settings};mount.querySelectorAll('[data-setting]').forEach(el=>next[el.dataset.setting]=el.value.trim());for(const key of ['mapUrl','misUrl','privacyUrl','licenseUrl','socialUrl']){if(next[key]&&!B.safeURL(next[key])){B.toast('Нужна полная http(s)-ссылка: '+key);return;}}if(next.bookingMode!=='demo'&&!next.misUrl){B.toast('Укажите URL расписания МИС');return;}E.checkpoint();B.state.settings=next;for(const key of ['contact-phone','header-phone','contact-email','contact-address','map-address'])delete B.state.texts[key];B.state.links['contact-phone']=next.phone?'tel:'+next.phone.replace(/[^\d+]/g,''):'';B.state.links['contact-email']=next.email?'mailto:'+next.email:'';E.changed();B.render();B.toast('Настройки применены');return;}
if(action==='reset-all'){const d=document.createElement('dialog');d.innerHTML='<h3>Сбросить изменения?</h3><p style="margin-top:18px">Тексты, цвета и изображения вернутся к исходным. Действие можно отменить кнопкой «Отменить».</p><div style="display:flex;gap:10px"><button class="studio-button primary" data-confirm>Сбросить</button><button class="studio-button" data-cancel>Оставить</button></div>';d.dataset.studio='';document.body.append(d);d.showModal();d.querySelector('[data-cancel]').onclick=()=>{d.close();d.remove();};d.querySelector('[data-confirm]').onclick=()=>{E.checkpoint();B.state=structuredClone(B.defaults);E.selection=null;B.ui.type='doctor';B.ui.item='doctor-1';E.changed();B.render();E.render();d.close();d.remove();};return;}
if(action==='undo'||action==='redo'){const from=action==='undo'?E.history:E.future,to=action==='undo'?E.future:E.history;if(!from.length)return;to.push(JSON.stringify(B.state));B.state=JSON.parse(from.pop());E.changed();B.render();E.render();return;}
if(action==='export-json'){E.download(JSON.stringify(B.state,null,2),'benz-project.json','application/json');return;}
if(action==='export-html'){E.download(E.html(false),'index.html','text/html');B.toast('Готовый HTML скачан');return;}
if(action==='export-studio'){E.download(E.html(true),'benz-studio.html','text/html');B.toast('Редактируемый HTML скачан');return;}
if(action==='export-zip'){const html=E.html(false);const project=JSON.stringify(B.state,null,2);const readme='Бенц Медикал ВРН\n\nindex.html — готовый автономный сайт без редактора. Откройте двойным кликом или загрузите на статический хостинг.\nbenz-studio.html — автономная версия с редактором.\nbenz-project.json — резервная копия настроек.\n\nПо умолчанию запись демонстрационная, данные не отправляются. Реальные записи: Редактор > Настройки > МИС.\nДля карты задайте iframe src в настройках. Перед публикацией замените lorem ipsum, загрузите фотографии, укажите контакты и документы.\nВсе изображения встроены. Никаких внешних библиотек и сборки не требуется.\n';E.download(E.zip([['index.html',html],['benz-studio.html',E.html(true)],['benz-project.json',project],['README.txt',readme]]),'benz-medical-site.zip','application/zip');B.toast('Сайт и редактируемая версия скачаны');}
});
E.html=editable=>{const clone=document.documentElement.cloneNode(true);clone.querySelectorAll('[data-studio]').forEach(el=>el.remove());if(!editable)clone.querySelectorAll('[data-editor]').forEach(el=>el.remove());clone.querySelectorAll('.is-selected').forEach(el=>el.classList.remove('is-selected'));clone.querySelector('body').classList.remove('studio-editing');clone.querySelector('#app').removeAttribute('class');clone.querySelector('#app').innerHTML='';clone.querySelector('#toast').className='';clone.querySelector('#toast').textContent='';clone.querySelector('#site-data').textContent=JSON.stringify(B.state).replace(/</g,'\\u003c');return '<!doctype html>\n'+clone.outerHTML;};
E.download=(data,name,type)=>{const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);};
E.zip=files=>{const encoder=new TextEncoder();let offset=0;const parts=[],entries=[];const crc=data=>{let crc=0xffffffff;for(const byte of data){crc^=byte;for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}return (crc^0xffffffff)>>>0;};const block=(size,fill)=>{const b=new Uint8Array(size);fill(new DataView(b.buffer));return b;};const stamp=new Date(),time=(stamp.getHours()<<11)|(stamp.getMinutes()<<5)|(stamp.getSeconds()>>1),date=((stamp.getFullYear()-1980)<<9)|((stamp.getMonth()+1)<<5)|stamp.getDate();for(const[name,content]of files){const n=encoder.encode(name),data=encoder.encode(content),c=crc(data);const header=block(30,v=>{v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(10,time,true);v.setUint16(12,date,true);v.setUint32(14,c,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,n.length,true);});parts.push(header,n,data);entries.push({n,c,len:data.length,offset});offset+=30+n.length+data.length;}const directoryOffset=offset;for(const f of entries){parts.push(block(46,v=>{v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,0x800,true);v.setUint16(12,time,true);v.setUint16(14,date,true);v.setUint32(16,f.c,true);v.setUint32(20,f.len,true);v.setUint32(24,f.len,true);v.setUint16(28,f.n.length,true);v.setUint32(42,f.offset,true);}),f.n);offset+=46+f.n.length;}parts.push(block(22,v=>{v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,offset-directoryOffset,true);v.setUint32(16,directoryOffset,true);}));return new Blob(parts,{type:'application/zip'});};
E.validate=data=>{if(!data||data.version!==1)throw Error('Нужен проект Бенц версии 1');const out=structuredClone(B.defaults);for(const kind of ['texts','styles','images','links']){if(data[kind]&&typeof data[kind]==='object'&&!Array.isArray(data[kind])){out[kind]={};for(const[k,v]of Object.entries(data[kind])){if(!/^[a-zA-Z0-9_-]{1,100}$/.test(k)||['__proto__','constructor','prototype'].includes(k))continue;if(kind==='styles'&&v&&typeof v==='object'){out[kind][k]={};for(const[prop,val]of Object.entries(v))if(['color','backgroundColor','borderColor'].includes(prop)&&/^#[a-f\d]{6}$/i.test(val))out[kind][k][prop]=val;}else if(kind==='texts'&&typeof v==='string')out[kind][k]=v.slice(0,20000);else if(kind==='images'&&typeof v==='string'&&/^data:image\/(png|jpeg|webp|svg\+xml);base64,/.test(v))out[kind][k]=v;else if(kind==='links'&&typeof v==='string')out[kind][k]=B.safeURL(v,'all');}}}for(const[k,v]of Object.entries(data.theme||{}))if(k in out.theme&&/^#[a-f\d]{6}$/i.test(v))out.theme[k]=v;for(const k of Object.keys(out.settings))if(typeof data.settings?.[k]==='string')out.settings[k]=data.settings[k].slice(0,4000);if(!['demo','link','iframe'].includes(out.settings.bookingMode))out.settings.bookingMode='demo';for(const list of ['doctors','analyses','drips']){if(!Array.isArray(data[list])||data[list].length===0||data[list].length>100)continue;const ids=new Set();out[list]=data[list].map((item,i)=>{if(!item||typeof item.id!=='string'||!/^\w[\w-]{0,80}$/.test(item.id)||ids.has(item.id))throw Error('Некорректный или повторяющийся ID в '+list);ids.add(item.id);const base={...B.defaults[list][i%B.defaults[list].length]};for(const k of Object.keys(base))if(typeof item[k]==='string')base[k]=item[k].slice(0,1000);if(list==='drips'&&!/^#[a-f\d]{6}$/i.test(base.color))base.color='#858969';return base;});}if(data.schedule){const days=data.schedule.days?.filter(x=>Number.isInteger(x)&&x>=0&&x<=6),times=data.schedule.times?.filter(x=>typeof x==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(x));if(days?.length&&times?.length)out.schedule={days:[...new Set(days)],times:[...new Set(times)].sort()};}return out;};
document.addEventListener('click',ev=>{if(!E.open||!E.selecting||ev.target.closest('[data-studio]'))return;const target=ev.target.closest('[data-edit],[data-image],[data-style]');if(target){ev.preventDefault();ev.stopImmediatePropagation();E.select(target);}},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&E.open&&!document.querySelector('dialog[open]')){E.open=false;E.render();}});
try{const stored=localStorage.getItem(E.storageKey);if(stored){B.state=E.validate(JSON.parse(stored));B.render();E.message='Восстановлены ваши правки';}}catch{E.message='Автосохранение недоступно';}
const limit=B.ui.dripLimit;B.ui.dripLimit=B.state.drips.length;B.renderDrips();B.ui.dripLimit=limit;B.renderDrips();
E.render();
